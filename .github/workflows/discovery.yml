name: Discover NYC mixers and tech
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: event-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run discover -- --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-event-shortlist
          path: .cache/recommendations.json
          retention-days: 7
          if-no-files-found: warn
